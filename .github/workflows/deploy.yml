name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Write .env.keys
        run: |
          cat > .env.keys << 'EOF'
          DOTENV_PRIVATE_KEY_PRODUCTION=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          EOF
          chmod 600 .env.keys

      - name: Build & deploy
        run: |
          docker compose -f compose.prod.yml build
          docker compose -f compose.prod.yml up -d

      - name: Cleanup
        if: always()
        run: rm -f .env.keys
